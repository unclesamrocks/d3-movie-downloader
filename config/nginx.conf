server {
    listen 80;
    server_name 005.ggwp.su;

    # Redirect all traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    server_name 005.ggwp.su;

    location /webhook {
        proxy_pass http://d3-movie-downloader:3000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://wg-easy:51821/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/005.ggwp.su/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/005.ggwp.su/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}